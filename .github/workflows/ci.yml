name: UHI Protocol CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Core Invariant Tests
        run: |
          python tests/simulate_protocol.py

      - name: Run Advanced Protocol & PQC/Conway Tests
        run: |
          python tests/simulate_advanced_protocol.py

      - name: Validate Candid Interfaces & DFX Configuration
        run: |
          python -c "import json; f = open('dfx.json'); cfg = json.load(f); assert len(cfg['canisters']) == 8; print('dfx.json canister count verified: 8 canisters present.')"
