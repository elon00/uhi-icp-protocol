name: UHI Protocol CI (Development)
on:
  push:
    branches: [main, master, safety/english-reality-gates]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  development-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python model tests (not canister integration)
        run: |
          python tests/simulate_protocol.py
          python tests/simulate_advanced_protocol.py
      - name: Financial safety regression tests
        run: python -m unittest discover -s tests -p test_safety_regression.py -v
      - name: DFX configuration sanity (not Candid typecheck)
        run: python -c "import json; c=json.load(open('dfx.json')); assert len(c['canisters']) == 8"
      - name: Show production readiness is separately blocked
        run: |
          echo 'Development tests only. This job does NOT certify ICP mainnet readiness.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Strict fail-closed release gate: One-Click UHI Reality Verification.' >> "$GITHUB_STEP_SUMMARY"
